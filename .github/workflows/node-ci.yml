name: Reusable Node CI

# Reusable Node CI workflow. Consumed by Milton-Group repos via:
#   uses: Milton-Group/.github/.github/workflows/node-ci.yml@v1
#
# Supports npm (default), yarn, and pnpm, selected via the `package-manager`
# input. npm stays the default so existing consumers are byte-for-byte
# unaffected. yarn support was added for mira-app — the first consumer that
# actually needed it (see MILTON-722). pnpm support follows as a MILTON-722
# follow-up; its first consumer is also mira-app, after the monorepo
# restructure. Callers pin a tag (e.g. @v1) or a SHA, so this change only
# reaches a consumer when it bumps the ref it points at.
#
# The naive `${{ inputs.package-manager }} ci` pattern is broken (`pnpm ci` /
# `yarn ci` are not valid commands), so each manager gets its own explicit
# install + script steps below rather than a single templated command.
#
# pnpm additionally REQUIRES the consuming repo to set the `packageManager`
# field in its package.json: pnpm/action-setup@v4 is invoked without an explicit
# version and reads the pnpm version from that field. The validation step below
# fails fast with a clear error when package-manager=pnpm and the field is
# absent, rather than letting action-setup emit a cryptic failure.

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        type: string
        default: "22"
      working-directory:
        description: "Path to the Node project root (for monorepos)"
        type: string
        default: "."
      package-manager:
        description: "Package manager to use. Allowed values: npm | yarn | pnpm (default: npm)"
        type: string
        default: "npm"
      skip-typecheck:
        description: "Skip the typecheck step (for repos without TypeScript)"
        type: boolean
        default: false
      skip-test:
        description: "Skip the test step (for repos with no test script yet)"
        type: boolean
        default: false

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Validate package-manager input
        if: ${{ inputs.package-manager != 'npm' && inputs.package-manager != 'yarn' && inputs.package-manager != 'pnpm' }}
        working-directory: .
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          printf '::error::package-manager must be exactly npm, yarn, or pnpm, got %s\n' "$PACKAGE_MANAGER"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      # pnpm/action-setup reads the pnpm version from package.json's
      # `packageManager` field (no explicit version is pinned here). pnpm
      # projects keep that field and pnpm-lock.yaml at the WORKSPACE ROOT,
      # which this workflow requires to be the repo root — working-directory
      # still controls where scripts run (pnpm resolves the workspace upward).
      # Fail fast with an actionable message when the field is missing or
      # doesn't pin pnpm, before action-setup emits a less obvious error.
      # `node -p` makes a malformed/unreadable package.json FAIL the step
      # rather than silently pass.
      - name: Validate pnpm packageManager field
        if: ${{ inputs.package-manager == 'pnpm' }}
        working-directory: .
        run: |
          OK=$(node -p "/^pnpm@/.test(require('./package.json').packageManager || '')")
          if [ "$OK" != "true" ]; then
            echo "::error::package-manager=pnpm requires a repo-root package.json with a pnpm 'packageManager' field, e.g. \"packageManager\": \"pnpm@9.15.0\" (missing, not pnpm@<version>, or package.json unreadable)."
            exit 1
          fi

      # pnpm path: install pnpm BEFORE setup-node so setup-node's `cache: pnpm`
      # can resolve the pnpm store path (it shells out to `pnpm store path`).
      # No version input — action-setup reads it from the repo-root
      # package.json `packageManager` field (validated above). Third-party
      # action pinned by commit SHA (org-wide blast radius via this reusable
      # workflow).
      - name: Setup pnpm
        if: ${{ inputs.package-manager == 'pnpm' }}
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: package.json

      # pnpm's lockfile lives at the workspace (repo) root, so its cache path
      # is NOT prefixed with working-directory like npm/yarn.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager == 'yarn' && 'yarn' || inputs.package-manager == 'pnpm' && 'pnpm' || 'npm' }}
          cache-dependency-path: ${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || format('{0}/{1}', inputs.working-directory, inputs.package-manager == 'yarn' && 'yarn.lock' || 'package-lock.json') }}

      # --- npm path (default) ---
      # Guarded on `== 'npm'` (not `!= 'yarn'`) so pnpm no longer falls through
      # into this path now that a third manager exists.
      - name: Install dependencies
        if: ${{ inputs.package-manager == 'npm' }}
        run: npm ci

      - name: Lint
        if: ${{ inputs.package-manager == 'npm' }}
        run: npm run lint --if-present

      - name: Typecheck
        if: ${{ !inputs.skip-typecheck && inputs.package-manager == 'npm' }}
        run: npm run typecheck --if-present

      - name: Test
        if: ${{ !inputs.skip-test && inputs.package-manager == 'npm' }}
        run: npm test --if-present

      # --- yarn path ---
      # Supported: yarn classic (v1), the runner default. Repos that pin a yarn
      # version via package.json `packageManager` get that version at install
      # time through corepack (under Berry, --frozen-lockfile is a deprecated
      # alias for --immutable and still enforces the lockfile).
      #
      # yarn v1 has no --if-present, so each script step probes package.json
      # first and runs the script only when it exists, preserving the npm
      # `--if-present` no-op-when-absent semantics above. The probe uses
      # `node -p` in a command substitution so a malformed/unreadable
      # package.json FAILS the step instead of silently skipping the script.
      - name: Enable corepack (yarn)
        if: ${{ inputs.package-manager == 'yarn' }}
        run: corepack enable

      - name: Install dependencies (yarn)
        if: ${{ inputs.package-manager == 'yarn' }}
        run: yarn install --frozen-lockfile

      - name: Lint (yarn)
        if: ${{ inputs.package-manager == 'yarn' }}
        run: |
          HAS=$(node -p "Boolean((require('./package.json').scripts || {}).lint)")
          if [ "$HAS" = "true" ]; then
            yarn lint
          else
            echo "No lint script in package.json; skipping (yarn has no --if-present)."
          fi

      - name: Typecheck (yarn)
        if: ${{ !inputs.skip-typecheck && inputs.package-manager == 'yarn' }}
        run: |
          HAS=$(node -p "Boolean((require('./package.json').scripts || {}).typecheck)")
          if [ "$HAS" = "true" ]; then
            yarn typecheck
          else
            echo "No typecheck script in package.json; skipping (yarn has no --if-present)."
          fi

      - name: Test (yarn)
        if: ${{ !inputs.skip-test && inputs.package-manager == 'yarn' }}
        run: |
          HAS=$(node -p "Boolean((require('./package.json').scripts || {}).test)")
          if [ "$HAS" = "true" ]; then
            yarn test
          else
            echo "No test script in package.json; skipping (yarn has no --if-present)."
          fi

      # --- pnpm path ---
      # pnpm supports --if-present natively (unlike yarn v1), so the script
      # steps need no package.json probe — an absent script is a clean no-op.
      # skip-typecheck / skip-test guard composition matches the other paths.
      # NOTE: `--if-present` must come BEFORE the script name for pnpm. Unlike
      # npm, `pnpm run <script> --if-present` forwards the flag to the script
      # (e.g. `turbo run lint --if-present` → "unexpected argument"), so the
      # flag precedes the script name here.
      - name: Install dependencies (pnpm)
        if: ${{ inputs.package-manager == 'pnpm' }}
        run: pnpm install --frozen-lockfile

      - name: Lint (pnpm)
        if: ${{ inputs.package-manager == 'pnpm' }}
        run: pnpm run --if-present lint

      - name: Typecheck (pnpm)
        if: ${{ !inputs.skip-typecheck && inputs.package-manager == 'pnpm' }}
        run: pnpm run --if-present typecheck

      - name: Test (pnpm)
        if: ${{ !inputs.skip-test && inputs.package-manager == 'pnpm' }}
        run: pnpm run --if-present test
